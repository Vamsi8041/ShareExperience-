<!DOCTYPE html>
<html>
  <head>
    <title>Submit Experience</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h1 class="h4 mb-0">Share Your Interview Experience</h1>
            </div>
            <div class="card-body">
              <form method="post" action="/submit">
                <div class="mb-3">
                  <label for="name" class="form-label">Your Name</label>
                  <input
                    type="text"
                    class="form-control"
                    name="name"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="company" class="form-label">Company Name</label>
                  <input
                    type="text"
                    class="form-control"
                    name="company"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="role" class="form-label">Role Applied For</label>
                  <input
                    type="text"
                    class="form-control"
                    name="role"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="tags" class="form-label"
                    >Tags (comma-separated, e.g., "technical, behavioral,
                    coding")</label
                  >
                  <input type="text" class="form-control" name="tags" />
                  <div class="form-text">
                    Help others find your experience by adding relevant tags
                  </div>
                </div>
                <div class="mb-3">
                  <label for="difficulty" class="form-label"
                    >Interview Difficulty (1-10)</label
                  >
                  <input
                    type="range"
                    class="form-range"
                    name="difficulty"
                    min="1"
                    max="10"
                    value="5"
                    id="difficultySlider"
                    oninput="updateDifficultyValue()"
                  />
                  <div class="d-flex justify-content-between">
                    <span>1 (Easy)</span>
                    <span id="difficultyValue">5</span>
                    <span>10 (Hard)</span>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="experience" class="form-label"
                    >Experience Details</label
                  >
                  <textarea
                    class="form-control"
                    name="experience"
                    rows="8"
                    required
                  ></textarea>
                  <div class="form-text">
                    Describe your interview process, questions asked, and any
                    tips
                  </div>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <a
                    href="{{ url_for('home') }}"
                    class="btn btn-secondary me-md-2"
                  >
                    <i class="bi bi-arrow-left"></i> Back
                  </a>
                  <button type="submit" class="btn btn-success">
                    <i class="bi bi-send"></i> Submit
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function updateDifficultyValue() {
        document.getElementById("difficultyValue").textContent =
          document.getElementById("difficultySlider").value;
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
