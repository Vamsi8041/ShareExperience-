<!DOCTYPE html>
<html>
  <head>
    <title>Edit Experience</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h1 class="h4 mb-0">Edit Interview Experience</h1>
            </div>
            <div class="card-body">
              <form
                method="post"
                action="{{ url_for('edit_experience', exp_id=experience['id']) }}"
              >
                <input
                  type="hidden"
                  name="csrf_token"
                  value="{{ csrf_token }}"
                />

                <div class="mb-3">
                  <label for="name" class="form-label">Your Name</label>
                  <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ experience['name'] }}"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="company" class="form-label">Company Name</label>
                  <input
                    type="text"
                    class="form-control"
                    name="company"
                    value="{{ experience['company'] }}"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="role" class="form-label">Role Applied For</label>
                  <input
                    type="text"
                    class="form-control"
                    name="role"
                    value="{{ experience['role'] }}"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="tags" class="form-label"
                    >Tags (comma-separated)</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="tags"
                    value="{{ experience['tags'] or '' }}"
                  />
                </div>
                <div class="mb-3">
                  <label for="difficulty" class="form-label"
                    >Interview Difficulty (1-10)</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    name="difficulty"
                    min="1"
                    max="10"
                    value="{{ experience['difficulty'] }}"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="experience" class="form-label"
                    >Experience Details</label
                  >
                  <textarea
                    class="form-control"
                    name="experience"
                    rows="8"
                    required
                  >
{{ experience['experience'] }}</textarea
                  >
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <a
                    href="{{ url_for('view_experience', exp_id=experience['id']) }}"
                    class="btn btn-secondary me-md-2"
                  >
                    <i class="bi bi-x-circle"></i> Cancel
                  </a>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Save Changes
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
